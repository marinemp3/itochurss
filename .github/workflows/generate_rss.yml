name: Generate RSS Feed

on:
  # 手動実行も可能にする
  workflow_dispatch:
  # スケジュール実行: 毎週金曜日 14:30 (中国時間=UTC+8)
  schedule:
    - cron: '30 6 * * 5'  # UTC 6:30 は 中国時間 14:30

# 権限を明示的に設定
permissions:
  contents: write
  actions: write  # keepalive アクションが GitHub API を利用するために必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # トークンを明示的に指定
          token: ${{ secrets.GITHUB_TOKEN }}
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run RSS generation script
        run: |
          python generate_rss.py

      - name: Commit and push RSS feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feed.xml
          # 変更があればコミット、なければスキップ
          git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
