name: Generate RSS Feed

on:
  # 手動実行も可能にする
  workflow_dispatch:
  # スケジュール実行: 毎週金曜日 14:30 (中国時間=UTC+8)
  schedule:
    - cron: '30 6 * * 5'  # UTC 6:30 は 中国時間 14:30

# 権限を明示的に設定
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # トークンを明示的に指定
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run RSS generation script
        run: |
          python generate_rss.py

      - name: Commit and push RSS feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add feed.xml
          # 変更があればコミット、なければスキップ
          git diff --staged --quiet || git commit -m "Update RSS feed [skip ci]"
          git push
